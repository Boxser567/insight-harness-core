# Desktop-focused sandbox CI. A master push proves the supported macOS Runtime
# artifact and Seatbelt paths; Linux-only bwrap and Landlock proofs remain
# available through an explicit manual dispatch.
name: Sandbox

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  macos-desktop:
    name: desktop macos (runtime artifact + seatbelt)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Runtime artifact unit test (clean checkout)
        run: pnpm exec vitest run scripts/desktop-runtime-artifact.spec.ts

      - name: Seatbelt e2e (real kernel confinement, world-verified)
        env:
          NO_COLOR: 1
        run: |
          set -u +e -o pipefail
          out=$(pnpm exec vitest run --config vitest.e2e.config.ts \
            packages/sandbox/sandbox-local/tests/seatbelt.e2e.ts \
            packages/shell/bash-sandbox/tests/seatbelt.e2e.ts 2>&1); status=$?
          echo "$out"
          [ "$status" -eq 0 ]
          echo "$out" | grep -qE 'Test Files[[:space:]]+2 passed \(2\)'

  linux-sandbox-e2e:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Only the bwrap leg has a Blacksmith equivalent: the earlier
          # migration dispatch runs measured that Blacksmith's Linux images do
          # not enforce Landlock (the run-guard would turn the leg red) and
          # its macOS image is unverified, so those legs stay on GitHub's
          # images under every failover value — see
          # .agents/notes/implemented/process/2026-09-09-blacksmith-failover-leg.md.
          - os: ubuntu-latest
            runner: bwrap
          - os: ubuntu-24.04
            runner: landlock
          - os: ubuntu-24.04-arm
            runner: landlock
          - os: macos-latest
            runner: seatbelt
    name: sandbox e2e (${{ matrix.runner }}, ${{ matrix.os }}, manual)
    runs-on: >-
      ${{ matrix.runner == 'bwrap' && vars.DSH_CI_FAILOVER_LINUX == 'blacksmith'
          && 'blacksmith-4vcpu-ubuntu-2404'
          || matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Install bubblewrap (unrestrict userns)
        if: matrix.runner == 'bwrap'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 \
            || echo "apparmor userns knob absent — the functional probe decides"

      - name: Build Landlock launcher for this architecture
        if: matrix.runner == 'landlock'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq musl-tools
          pnpm --dir native/system run build:ts
          pnpm --dir native/system run build:native

      - name: Sandbox e2e (real kernel confinement, world-verified)
        env:
          NO_COLOR: 1
        run: |
          set -u +e -o pipefail
          out=$(pnpm exec vitest run --config vitest.e2e.config.ts \
            packages/sandbox/sandbox-local/tests/${{ matrix.runner }}.e2e.ts \
            packages/shell/bash-sandbox/tests/${{ matrix.runner }}.e2e.ts 2>&1); status=$?
          echo "$out"
          [ "$status" -eq 0 ]
          echo "$out" | grep -qE 'Test Files[[:space:]]+2 passed \(2\)'

      - name: Build packages for the pack rehearsal
        if: matrix.runner == 'landlock'
        run: pnpm run build:official

      - name: Packed-distribution e2e (pack → install → confine)
        if: matrix.runner == 'landlock'
        env:
          NO_COLOR: 1
        run: |
          set -u +e -o pipefail
          out=$(pnpm exec vitest run --config vitest.e2e.config.ts \
            packages/sandbox/sandbox-local/tests/packed-install.e2e.ts 2>&1); status=$?
          echo "$out"
          [ "$status" -eq 0 ]
          echo "$out" | grep -qE 'Test Files[[:space:]]+1 passed \(1\)'

  # The unit suite runs on ubuntu in ci.yml's Linux jobs; macos-latest is this
  # workflow's only darwin runner, so the platform-dependent unit expectations
  # (Seatbelt path canonicalization: /tmp IS /private/tmp — sandbox semantics,
  # hence this workflow rather than ci-master.yml) take their darwin branch only
  # here. A job of its own so the seatbelt e2e leg keeps the matrix budget. The
  # budget below is a completion ceiling, not a latency target: the full suite
  # takes 16 minutes on a fast macos-latest runner and was under half done at
  # 20 on the slowest observed.
  unit-darwin:
    name: unit tests (darwin parity, macos-latest)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # The same key and value the coverage and serial lanes grant: on the
      # shared 3-vCPU runner, cases that inherit Vitest's 5000 ms default timed
      # out in spawn.spec.ts and changes.spec.ts (run 36370945526) while
      # passing in under a second on a quiet host. The ci-unit aggregate is
      # `pnpm run test` through the path that consumes the variable.
      - name: Unit tests (darwin parity)
        env:
          DSH_COVERAGE_TEST_TIMEOUT_MS: '90000'
        run: pnpm run check:ci:unit
